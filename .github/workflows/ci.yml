name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Format check (prettier --check)
        run: npm run format:check

      - name: Automated test suite
        run: npm test

      - name: Smoke test demo execution
        run: node examples/demo.mjs

      - name: Verify CLI executable
        run: |
          chmod +x src/cli.ts
          ./src/cli.ts help

      - name: Inspect npm packaging dry-run
        run: npm pack --dry-run
