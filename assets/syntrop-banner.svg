<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Vector Flow Gradients -->
    <linearGradient id="cyanB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="emeraldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="indigoB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="640" fill="url(#bgBanner)"/>
  
  <!-- Subtle Blueprint Tech Grid -->
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Radial Glow Behind Icon -->
  <circle cx="640" cy="220" r="320" fill="url(#centerGlow)"/>

  <!-- Outer Border Frame -->
  <rect x="12" y="12" width="1256" height="616" rx="20" fill="none" stroke="url(#borderGradBanner)" stroke-width="2"/>

  <!-- Ambient DAG Lattice Background Lines -->
  <g stroke="#334155" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.35">
    <line x1="200" y1="180" x2="520" y2="180"/>
    <line x1="760" y1="180" x2="1080" y2="180"/>
    <line x1="320" y1="360" x2="540" y2="280"/>
    <line x1="960" y1="360" x2="740" y2="280"/>
    <circle cx="200" cy="180" r="4" fill="#38BDF8"/>
    <circle cx="1080" cy="180" r="4" fill="#818CF8"/>
    <circle cx="320" cy="360" r="4" fill="#10B981"/>
    <circle cx="960" cy="360" r="4" fill="#38BDF8"/>
  </g>

  <!-- Centered Iconic Monogram (The Topological Nexus) Scaled to Center (640, 180) -->
  <g transform="translate(640, 175) scale(0.68) translate(-256, -256)">
    <!-- Squircle container -->
    <rect x="24" y="24" width="464" height="464" rx="100" fill="#0A0F1D" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Vector Ribbons with Glow -->
    <g filter="url(#glowBanner)">
      <!-- Upper Intent Ribbon (Cyan) -->
      <path d="M 160 200 L 256 144 L 352 200 L 352 248 L 256 192 L 208 220 Z" 
            fill="url(#cyanB)" opacity="0.95"/>

      <!-- Central Invariant Spine (Emerald Pulse) -->
      <path d="M 208 220 L 256 192 L 304 220 L 304 292 L 256 320 L 208 292 Z" 
            fill="url(#emeraldB)" opacity="0.9"/>

      <!-- Lower Execution Ribbon (Indigo) -->
      <path d="M 304 292 L 256 320 L 160 264 L 160 312 L 256 368 L 352 312 Z" 
            fill="url(#indigoB)" opacity="0.95"/>
    </g>

    <!-- Topological DAG Vertices -->
    <circle cx="256" cy="144" r="9" fill="#38BDF8"/>
    <circle cx="352" cy="200" r="8" fill="#818CF8"/>
    <circle cx="352" cy="312" r="8" fill="#818CF8"/>
    <circle cx="160" cy="200" r="8" fill="#38BDF8"/>
    <circle cx="160" cy="312" r="8" fill="#34D399"/>
    <circle cx="256" cy="368" r="9" fill="#10B981"/>

    <!-- Central Invariant Heart -->
    <circle cx="256" cy="256" r="12" fill="#00FF88"/>
    <circle cx="256" cy="256" r="22" fill="none" stroke="#00FF88" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Typography: SYNTROP -->
  <text x="640" y="385" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="12" 
        fill="url(#textGrad)" 
        text-anchor="middle">SYNTROP</text>

  <!-- Subtitle Tagline -->
  <text x="640" y="425" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="1" 
        fill="#94A3B8" 
        text-anchor="middle">The Deterministic Operations Kernel for AI Coding Agents</text>

  <text x="640" y="456" 
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="14" 
        font-weight="500" 
        letter-spacing="0.5" 
        fill="#64748B" 
        text-anchor="middle">Autonomous LLM Reasoning  •  Air-Gapped SQLite ACID Invariants  •  DAG Execution</text>

  <!-- Micro Technical Invariants Pill Badges -->
  <g transform="translate(640, 520)">
    <!-- Badge 1: 0 Dependencies -->
    <g transform="translate(-375, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4" fill="#38BDF8"/>
      <text x="95" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">0 Dependencies</text>
    </g>

    <!-- Badge 2: Node.js Built-in SQLite -->
    <g transform="translate(-185, 0)">
      <rect x="0" y="0" width="175" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4" fill="#10B981"/>
      <text x="98" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Node 24 Built-in</text>
    </g>

    <!-- Badge 3: Air-Gapped Local-First -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="175" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4" fill="#818CF8"/>
      <text x="98" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Air-Gapped Local</text>
    </g>

    <!-- Badge 4: MIT License -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4" fill="#F59E0B"/>
      <text x="95" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">MIT Licensed</text>
    </g>
  </g>
</svg>
